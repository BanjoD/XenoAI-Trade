  <script>
    /* GitHub Pages SPA-фолбэк: на любой несуществующий путь GH Pages отдаёт этот файл.
       Редкий случай «адрес с хвостовым слэшем» (/repo/signals/) — нормализуем без слэша,
       чтобы относительные пути js/css разрешились от /repo/. Обычные ссылки грузятся сразу. */
    (function () {
      var m = location.pathname.match(/\/([a-z]{3,10})\/$/i);
      var V = ["desk", "signals", "whales", "market", "events", "trades", "accounts", "portfolio", "leaders"];
      if (m && V.indexOf(m[1].toLowerCase()) !== -1) location.replace(location.pathname.slice(0, -1) + location.search + location.hash);
    })();
  </script>
